# Run the whole compendium reproducibly in one command:
#   docker compose -f examples/compose.yaml run --rm examples
#
# The repo root is bind-mounted to /work so the container reads the data package
# at ../state-finances/karnataka and writes results into examples/out on the host.
services:
  examples:
    build:
      context: ..
      dockerfile: examples/Dockerfile
    working_dir: /work/examples
    volumes:
      - ..:/work
    command: make reproduce
